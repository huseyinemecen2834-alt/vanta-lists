name: Update lists
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zararlı site listesi (URLhaus, malware-filter yansısı)
        run: |
          set -euo pipefail
          curl -fsSL https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts-online.txt -o hosts.txt
          {
            echo "# Vanta - Zararlı siteler"
            echo "# Kaynak: URLhaus (abuse.ch), https://gitlab.com/malware-filter/urlhaus-filter"
            echo "# \"Update lists\" iş akışı bu dosyayı her gün yeniden üretir."
            grep -v '^#' hosts.txt | awk 'NF >= 2 { print tolower($2) }' | grep '\.' | sort -u
          } > malware.txt
          rm hosts.txt
      - name: Değişiklik varsa gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add malware.txt
          git diff --cached --quiet || git commit -m "Zararlı site listesini güncelle"
          git push
